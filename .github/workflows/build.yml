name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  BUILD_CONFIGURATION: Release

jobs:
  build:
    runs-on: windows-latest
    # Alternative: use self-hosted runner with SDK pre-installed
    # runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Download InsERT SDK
      env:
        SDK_DOWNLOAD_URL: ${{ secrets.NEXO_SDK_ZIP_URL }}
        SDK_DOWNLOAD_TOKEN: ${{ secrets.NEXO_SDK_ZIP_TOKEN }}
      run: |
        # Create SDK directory
        New-Item -ItemType Directory -Path "src\lib\nexo-sdk" -Force | Out-Null

        if ($env:SDK_DOWNLOAD_URL) {
          $headers = @{}
          if ($env:SDK_DOWNLOAD_TOKEN) {
            $headers["Authorization"] = "Bearer $env:SDK_DOWNLOAD_TOKEN"
          }

          $zipPath = "nexo-sdk.zip"
          try {
            Invoke-WebRequest -Uri $env:SDK_DOWNLOAD_URL -OutFile $zipPath -Headers $headers -ErrorAction Stop
            Expand-Archive -Path $zipPath -DestinationPath "src\lib\nexo-sdk" -Force
          } catch {
            Write-Error "SDK download or extraction failed. Verify the private SDK secrets and archive."
            exit 1
          } finally {
            Remove-Item $zipPath -ErrorAction SilentlyContinue
          }
        }
        else {
          Write-Error "No SDK source available. Configure the private SDK secrets."
          exit 1
        }
      shell: pwsh

    - name: Restore dependencies
      run: dotnet restore src/NexoSferaApi.csproj

    - name: Build
      run: dotnet build src/NexoSferaApi.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-restore

    - name: Test HTTP security and route contracts
      run: dotnet test tests/NexoSferaApi.Tests/NexoSferaApi.Tests.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --verbosity normal

    - name: Publish
      run: dotnet publish src/NexoSferaApi.csproj --configuration ${{ env.BUILD_CONFIGURATION }} --no-build --output ./publish

